name: Build Flowr Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Flowr web bundle
        run: npm run build

      - name: Bundle production server
        run: npx esbuild server.ts --bundle --platform=node --format=esm --packages=external --outfile=server.mjs

      - name: Install Electron packager tools
        run: npm install --save-dev --legacy-peer-deps electron electron-builder

      - name: Package Flowr Windows .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.yml --win --publish never

      - name: Upload Flowr EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flowr-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
